worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;

events {
  worker_connections  4096;  # Default: 1024
}

http {
    include    $!{nginx}/conf/mime.types;
    index    index.html index.htm index.php;

    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout;
    error_log /dev/stdout;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128; # this seems to be required para alguns vhosts

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app;
        )

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        index index.php;

        charset utf-8;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # IMPORTANTE: arquivos estáticos (css/js/imagens/fontes) precisam
        # de uma regra própria ANTES do fallback genérico abaixo. Sem isso,
        # se um desses arquivos não existir no servidor por qualquer motivo
        # (ex.: deploy que não enviou a pasta assets/ completa), o
        # try_files do "location /" cairia no fallback e devolveria o HTML
        # do index.php no lugar do arquivo — o navegador recebe uma
        # resposta 200 "válida" só que com Content-Type de HTML, recusa
        # aplicar como CSS/JS, e a página inteira fica sem nenhum estilo,
        # sem erro nenhum visível além do console do navegador. Com a regra
        # abaixo, um arquivo estático que realmente não existir dá um 404
        # de verdade (fácil de perceber e depurar) em vez de "sumir" o CSS
        # inteiro silenciosamente.
        location ~* \.(css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf|eot|map|txt|json|webmanifest)$ {
            try_files $uri =404;
            access_log off;
        }

        # Landing page é uma única página (index.php). Qualquer URL que não
        # corresponda a um arquivo real cai de volta para o index.php em
        # vez de gerar um erro puro do nginx (404 cru). Isso também impede
        # que a estrutura de pastas do projeto seja "varrida" por tentativa
        # e erro de URL.
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Bloqueia acesso público direto a arquivos sensíveis que não são
        # páginas (config com credenciais do banco, scripts SQL, docs
        # internas). Eles continuam funcionando normalmente quando incluídos
        # internamente pelo PHP (require/include) — o bloqueio é só contra
        # requisição HTTP direta.
        location ~* \.(sql|md|log|env)$ {
            deny all;
            return 404;
        }

        location = /config.php {
            deny all;
            return 404;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
